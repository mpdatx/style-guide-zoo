# pmdocs configuration — see the project-docs skill.
[site]
title = "style-guide-zoo"

[paths]
specs = "docs/superpowers/specs"
plans = "docs/superpowers/plans"
# Markdown under docs/ that is not part of the convention: not validated, not rendered.
exclude = []

# One [[map]] per area of the code: when files matching `paths` change,
# at least one of `pages` should change in the same commit.

# The generation pipeline: content loading, hashing, staleness, the CLI backend.
[[map]]
paths = ["runner/**", "config/**", "prompts/**"]
pages = ["docs/architecture.md"]

# The build that folds records into the data the browser reads.
[[map]]
paths = ["build/**"]
pages = ["docs/architecture.md"]

# The static site itself. `site/data/**` is generated output, excluded from
# coverage below, so only the three hand-written files are mapped here.
[[map]]
paths = ["site/*.html", "site/*.js", "site/*.css"]
pages = ["docs/architecture.md"]

# A guide is a system prompt and a product surface at once: adding or retiring
# one changes what the project offers and carries a licensing claim. Both pages
# are named, and changing either satisfies the check.
#
# CORPUS-LICENSES.md lives at the repository root because it is a public-facing
# licence statement linked from the README. test/repo-content.test.js
# additionally asserts that every corpus passage appears in its table and that
# the table lists no passage that does not exist — a hard failure for a missing
# row, where this entry only warns that the file went untouched.
[[map]]
paths = ["guides/**", "corpus/**"]
pages = ["docs/product.md", "CORPUS-LICENSES.md"]

[[map]]
paths = ["test/**"]
pages = ["docs/architecture.md"]

[[map]]
paths = [".github/workflows/**"]
pages = ["docs/architecture.md"]

# Tracked files matching `include` (minus `exclude`) should be covered by some [[map]].
[coverage]
include = [
  "runner/**",
  "build/**",
  "site/**",
  "guides/**",
  "corpus/**",
  "prompts/**",
  "config/**",
  "test/**",
  ".github/**",
]
# Generated, not authored: 450 committed generation records and the site data
# built from them. Test fixtures are inputs to the suite, not described prose.
exclude = [
  "results/**",
  "site/data/**",
  "test/fixtures/**",
]
