name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: node build/build-site.js
      - name: Check site/data is up to date
        run: |
          # --porcelain rather than `git diff`, so that a rebuild which ADDS
          # cell files (a new guide or passage) is caught too. `git diff`
          # ignores untracked paths and would pass silently.
          drift="$(git status --porcelain -- site/data)"
          if [ -n "$drift" ]; then
            echo "$drift"
            git diff -- site/data
            echo "::error::site/data/ is out of date. Run 'node build/build-site.js' and commit the result."
            exit 1
          fi
